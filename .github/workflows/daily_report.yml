name: Daily Structure Report

on:
  schedule:
    # 台灣時間約 08:02（週二～週六）＝美股週一～週五盤後
    - cron: "2 0 * * 1-5"
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run original analysis
        run: python structure_analysis.py

      - name: Run charts-version analysis
        run: python structure_analysis_charts.py
        
      - name: Run live / premarket snapshot
        run: python premarket_analysis.py

      - name: Show output files
        run: ls -la report.html report_charts.html || true

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html report_charts.html report_live.html structure_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update reports $(date -u +%Y-%m-%d)"
            git push
          fi
