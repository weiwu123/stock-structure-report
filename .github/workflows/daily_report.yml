name: Daily Structure Report

on:
  schedule:
    # 台灣時間 08:02（週二～週六）＝ 對應美股週一～週五盤後結束後
    # UTC 00:02，週一到週五
    - cron: "2 0 * * 1-5"
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許把報告 commit 回 repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run analysis
        run: |
          python structure_analysis.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add report.html
          # 若沒有變更就不 commit
          git diff --staged --quiet || git commit -m "update report $(date -u +%Y-%m-%d)"
          git push
